<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voucher Entri Transaksi Kas Keluar</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans p-6">
    <div class="max-w-5xl mx-auto space-y-6">
        <header class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl flex justify-between items-center">
            <div>
                <span class="text-xs font-semibold text-indigo-400 uppercase">Sistem Akuntansi Ritel</span>
                <h1 class="text-2xl font-bold text-white">Voucher Kas Keluar</h1>
            </div>
            <div id="status-badge" class="px-4 py-2 rounded-xl text-xs font-bold border bg-amber-500/10 text-amber-400 border-amber-500/30">
                Belum Lengkap
            </div>
        </header>

        <main class="bg-slate-900 border border-slate-800 p-6 rounded-2xl shadow-xl space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Nomor Voucher</label>
                    <input type="text" id="voucher-no" value="KK-2026-0001" readonly class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm font-mono text-slate-400">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Tanggal Transaksi</label>
                    <input type="date" id="trans-date" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Disiapkan Oleh</label>
                    <input type="text" id="prepared-by" required placeholder="Nama penanggung jawab" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Dibayarkan Kepada</label>
                    <input type="text" id="payee" required placeholder="Nama penerima pembayaran" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white">
                </div>
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Deskripsi / Keterangan</label>
                <input type="text" id="trans-desc" value="Pembayaran beban listrik toko cabang utama" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-sm text-white">
            </div>

            <div class="border-t border-slate-800 pt-4">
                <div class="flex justify-between items-center mb-3">
                    <h3 class="font-bold text-sm">Rincian Baris Jurnal</h3>
                    <button onclick="addRow()" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-semibold">+ Tambah Baris</button>
                </div>
                <div id="journal-rows" class="space-y-3">
                    <!-- Baris Jurnal Dinamis dimuat oleh app.js -->
                </div>
            </div>

            <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 flex justify-between items-center">
                <div>
                    <div class="text-xs text-slate-400 uppercase">Total Debit / Kredit</div>
                    <div class="text-lg font-mono font-bold text-emerald-400" id="total-summary">Rp 0 / Rp 0</div>
                </div>
                <button id="submit-btn" disabled onclick="submitVoucher()" class="px-6 py-2.5 rounded-xl font-semibold text-sm bg-slate-800 text-slate-500 cursor-not-allowed transition">
                    Submit Voucher
                </button>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
    <script src="feature.js"></script>
</body>
</html>
